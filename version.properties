# Single source for the app version. VERSION_CODE and VERSION_NAME are derived:
#   ordinal = WONDER_BUILD (1..99), or base36(WONDER_BUILD) - 260 for A0..ZZ
#   versionCode = 11404000 + ordinal
#   versionName = <CORE_VERSION>-wonder.<WONDER_BUILD>
# Keep 11404000 in sync with GitHubReleaseFeed.WONDER_VERSION_CODE_BASE
# (WonderVersionTest guards the pair). Build-code arithmetic:
# docs/versioning.md.
# wonder.AN adds DNS-cache-miss events and group/profile observability fields.
CORE_VERSION=1.15.0-alpha.13
WONDER_BUILD=AN
GO_VERSION=go1.26.10
