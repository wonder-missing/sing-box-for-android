name: Release notify

on:
  workflow_run:
    workflows: ["Release"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  feishu:
    name: Send release notification to Feishu
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Compose message
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          TAG: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          kind="failure"
          version=""
          apk_url=""
          release_url=""
          tests=""
          failures=""
          errors=""
          skipped=""
          test_seconds=""
          build_seconds=""
          changelog_file="$RUNNER_TEMP/changelog.txt"
          tag_message_file="$RUNNER_TEMP/tag-message.txt"
          : > "$changelog_file"
          : > "$tag_message_file"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            kind="test"
          elif [ "$CONCLUSION" = "success" ]; then
            kind="success"
            tag="$TAG"
            if ! printf '%s' "$tag" | grep -q '^v'; then
              tag=$(gh release view -R "$REPO" --json tagName -q .tagName)
            fi
            version="${tag#v}"
            # Annotated tags carry Agent-Time and Agent-Loops. A lightweight tag has neither.
            tag_object=$(gh api "repos/$REPO/git/ref/tags/${tag}" --jq '[.object.type, .object.sha] | join(" ")' || true)
            tag_object_type=${tag_object%% *}
            tag_object_sha=${tag_object#* }
            if [ "$tag_object_type" = "tag" ] && [ -n "$tag_object_sha" ] && [ "$tag_object_sha" != "$tag_object_type" ]; then
              gh api "repos/$REPO/git/tags/${tag_object_sha}" --jq '.message // empty' > "$tag_message_file" \
                || : > "$tag_message_file"
            fi
            release_url=$(gh release view "$tag" -R "$REPO" --json url -q .url)
            apk_url=$(gh release view "$tag" -R "$REPO" --json assets \
              --jq '[.assets[] | select(.name | endswith("-arm64-v8a.apk")) | .url][0] // empty')
            sha="$SHA"
            if [ -z "$sha" ]; then
              sha=$(gh release view "$tag" -R "$REPO" --json targetCommitish -q .targetCommitish)
            fi
            run_id=$(gh run list -R "$REPO" -w Test --commit "$sha" --limit 20 \
              --json databaseId,conclusion,createdAt \
              --jq '[.[] | select(.conclusion=="success")] | sort_by(.createdAt) | last | .databaseId // empty' \
              || true)
            if [ -n "$run_id" ]; then
              if gh run download "$run_id" -R "$REPO" -n unit-test-count -D "$RUNNER_TEMP/unit-test-count"; then
                summary=$(find "$RUNNER_TEMP/unit-test-count" -name 'unit-test-count.txt' -print -quit)
                if [ -n "${summary}" ]; then
                  tests=$(sed -n 's/^tests=//p' "$summary" | head -n 1)
                  failures=$(sed -n 's/^failures=//p' "$summary" | head -n 1)
                  errors=$(sed -n 's/^errors=//p' "$summary" | head -n 1)
                  skipped=$(sed -n 's/^skipped=//p' "$summary" | head -n 1)
                fi
              else
                echo "unit-test-count artifact missing for Test run $run_id"
              fi
              if jobs=$(gh run view "$run_id" -R "$REPO" --json jobs --jq '.jobs'); then
                test_seconds=$(printf '%s' "$jobs" | python3 .github/scripts/compose_release_message.py --seconds unit-test || true)
              fi
            else
              echo "No successful Test run for $sha"
            fi
            if [ -n "${WORKFLOW_RUN_ID}" ]; then
              if jobs=$(gh run view "$WORKFLOW_RUN_ID" -R "$REPO" --json jobs --jq '.jobs'); then
                build_seconds=$(printf '%s' "$jobs" | python3 .github/scripts/compose_release_message.py --seconds build || true)
              fi
            fi
            prev=$(gh release list -R "$REPO" --limit 30 --json tagName,isDraft \
              --jq "[.[] | select(.isDraft|not) | select(.tagName != \"$tag\")][0].tagName // empty")
            if [ -n "$prev" ]; then
              if ! gh api "repos/$REPO/compare/${prev}...${tag}" \
                --jq '.commits[].commit.message | split("\n")[0] | select(length > 0) | select(startswith("Merge ") | not)' \
                > "$changelog_file"; then
                echo "Could not read commits since $prev"
                : > "$changelog_file"
              fi
            fi
          else
            kind="failure"
            version="${TAG:-unknown}"
          fi

          python3 .github/scripts/compose_release_message.py \
            --kind "$kind" \
            --version "$version" \
            --conclusion "${CONCLUSION:-}" \
            --run-url "${RUN_URL:-}" \
            --tests "$tests" \
            --failures "$failures" \
            --errors "$errors" \
            --skipped "$skipped" \
            --test-seconds "$test_seconds" \
            --build-seconds "$build_seconds" \
            --tag-message-file "$tag_message_file" \
            --apk-url "$apk_url" \
            --release-url "$release_url" \
            --changelog-file "$changelog_file" \
            > "$RUNNER_TEMP/feishu-message.json"
          python3 - <<'PY'
          import json
          import os
          path = os.environ["RUNNER_TEMP"] + "/feishu-message.json"
          data = json.load(open(path, encoding="utf-8"))
          print("msg_type:", data["msg_type"])
          print(json.dumps(json.loads(data["content"]), ensure_ascii=False, indent=2)[:4000])
          PY

      - name: Send to Feishu
        env:
          LARK_NOTIFY_CREDENTIALS: ${{ secrets.LARK_NOTIFY_CREDENTIALS }}
          LARK_NOTIFY_RECIPIENTS: ${{ secrets.LARK_NOTIFY_RECIPIENTS }}
        run: |
          set -euo pipefail
          credentials=$(printf '%s' "$LARK_NOTIFY_CREDENTIALS" | tr -d '[:space:]')
          app_id="${credentials%%:*}"
          app_secret="${credentials#*:}"
          if [ -z "$app_id" ] || [ -z "$app_secret" ] || [ "$app_secret" = "$credentials" ]; then
            echo "LARK_NOTIFY_CREDENTIALS must be <App ID>:<App Secret>"
            exit 1
          fi
          auth_body=$(jq -n --arg id "$app_id" --arg secret "$app_secret" \
            '{app_id:$id, app_secret:$secret}')
          token_response=$(curl -sS --connect-timeout 10 --max-time 20 \
            -X POST "https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal" \
            -H "Content-Type: application/json" \
            --data-binary "$auth_body")
          token=$(printf '%s' "$token_response" | jq -r '.tenant_access_token // empty')
          if [ -z "$token" ]; then
            echo "Feishu auth failed: code=$(printf '%s' "$token_response" | jq -r '.code // "?"') msg=$(printf '%s' "$token_response" | jq -r '.msg // "?"')"
            exit 1
          fi
          spec=$(cat "$RUNNER_TEMP/feishu-message.json")
          msg_type=$(printf '%s' "$spec" | jq -r '.msg_type')
          content=$(printf '%s' "$spec" | jq -r '.content')
          if [ "$msg_type" != "text" ] && [ "$msg_type" != "interactive" ]; then
            echo "Unexpected Feishu msg_type: $msg_type"
            exit 1
          fi
          failed=0
          IFS=',' read -ra recipients <<< "$LARK_NOTIFY_RECIPIENTS"
          for entry in "${recipients[@]}"; do
            entry=$(printf '%s' "$entry" | tr -d '[:space:]')
            [ -z "$entry" ] && continue
            receiver_type="${entry%%:*}"
            receiver_id="${entry#*:}"
            case "$receiver_type" in
              open_id|chat_id|user_id|union_id|email) ;;
              *)
                echo "Unsupported receiver type: $receiver_type"
                failed=1
                continue
                ;;
            esac
            if [ -z "$receiver_id" ] || [ "$receiver_id" = "$entry" ]; then
              echo "Recipient must be <receiver_type>:<receiver_id>"
              failed=1
              continue
            fi
            payload=$(jq -n --arg receive_id "$receiver_id" --arg msg_type "$msg_type" --arg content "$content" \
              '{receive_id:$receive_id, msg_type:$msg_type, content:$content}')
            response=$(curl -sS --connect-timeout 10 --max-time 20 \
              -X POST "https://open.feishu.cn/open-apis/im/v1/messages?receive_id_type=${receiver_type}" \
              -H "Authorization: Bearer $token" \
              -H "Content-Type: application/json" \
              --data-binary "$payload")
            code=$(printf '%s' "$response" | jq -r '.code // 0')
            if [ "$code" != "0" ]; then
              echo "Feishu send failed for $receiver_type: code=$code msg=$(printf '%s' "$response" | jq -r '.msg // "?"')"
              failed=1
            else
              echo "Feishu notification sent to $receiver_type"
            fi
          done
          exit "$failed"
