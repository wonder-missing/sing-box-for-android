name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      signing_check_only:
        description: Only verify the signing secrets
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  require-signing:
    name: Require signing secrets
    runs-on: ubuntu-latest
    steps:
      - name: Setup OpenJDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Verify PKCS12 keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for name in SIGNING_KEYSTORE_BASE64 SIGNING_KEYSTORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing signing secrets: ${missing[*]}"
            echo "Set SIGNING_KEYSTORE_BASE64, SIGNING_KEYSTORE_PASSWORD, SIGNING_KEY_ALIAS, and SIGNING_KEY_PASSWORD."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          trap 'rm -f "$RUNNER_TEMP/signing/release.keystore"' EXIT
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/release.keystore"
          keytool -list -storetype PKCS12 \
            -keystore "$RUNNER_TEMP/signing/release.keystore" \
            -storepass "$SIGNING_KEYSTORE_PASSWORD" \
            -alias "$SIGNING_KEY_ALIAS"
          echo "Signing keystore opened. Alias: ${SIGNING_KEY_ALIAS}"

  version:
    name: Read version
    runs-on: ubuntu-latest
    needs: require-signing
    if: github.event_name != 'workflow_dispatch' || inputs.signing_check_only == false
    outputs:
      core_version: ${{ steps.version.outputs.core_version }}
      go_version: ${{ steps.version.outputs.go_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Read version.properties
        id: version
        run: |
          set -euo pipefail
          CORE_VERSION=$(grep '^CORE_VERSION=' version.properties | cut -d= -f2-)
          if [ -z "${CORE_VERSION}" ]; then
            echo "CORE_VERSION missing from version.properties"
            exit 1
          fi
          GO_VERSION=$(grep '^GO_VERSION=' version.properties | cut -d= -f2-)
          GO_VERSION=${GO_VERSION#go}
          echo "core_version=${CORE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "go_version=${GO_VERSION}" >> "$GITHUB_OUTPUT"

  libbox:
    name: Build libbox (${{ matrix.go_arch }})
    runs-on: ubuntu-latest
    needs: version
    if: github.event_name != 'workflow_dispatch' || inputs.signing_check_only == false
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        go_arch:
          - arm64
    steps:
      - name: Cache libbox.aar
        id: cache-libbox
        uses: actions/cache@v4
        with:
          path: libbox.aar
          # Same key as the Test workflow. Tag runs can restore caches from
          # the default branch (dev), where Test seeds this on every push.
          # Bump the trailing version when the libbox build recipe changes.
          key: libbox-aar-${{ needs.version.outputs.core_version }}-go${{ needs.version.outputs.go_version }}-${{ matrix.go_arch }}-v1
      - name: Checkout sing-box
        if: steps.cache-libbox.outputs.cache-hit != 'true'
        uses: actions/checkout@v5
        with:
          repository: SagerNet/sing-box
          ref: v${{ needs.version.outputs.core_version }}
          path: sing-box
          fetch-depth: 1
      - name: Setup Go
        if: steps.cache-libbox.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ needs.version.outputs.go_version }}
          cache: false
      - name: Cache Go modules
        if: steps.cache-libbox.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ hashFiles('sing-box/go.sum') }}
          restore-keys: go-mod-
      - name: Setup Android NDK
        if: steps.cache-libbox.outputs.cache-hit != 'true'
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28
      - name: Setup OpenJDK 17
        if: steps.cache-libbox.outputs.cache-hit != 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare Android SDK
        if: steps.cache-libbox.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_HOME:-}" ]; then
            if [ -d /usr/local/lib/android/sdk ]; then
              echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
              ANDROID_HOME=/usr/local/lib/android/sdk
            else
              echo "ANDROID_HOME=$HOME/.local/lib/android/sdk" >> "$GITHUB_ENV"
              ANDROID_HOME=$HOME/.local/lib/android/sdk
            fi
          fi
          mkdir -p "$ANDROID_HOME/licenses"
          if ! touch "$ANDROID_HOME/licenses/android-sdk-license" 2>/dev/null; then
            ANDROID_HOME="$HOME/.local/lib/android/sdk"
            echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
            mkdir -p "$ANDROID_HOME/licenses"
            touch "$ANDROID_HOME/licenses/android-sdk-license"
          fi
      - name: Set tag
        if: steps.cache-libbox.outputs.cache-hit != 'true'
        working-directory: sing-box
        run: git tag "v${{ needs.version.outputs.core_version }}" -f
      - name: Build library
        if: steps.cache-libbox.outputs.cache-hit != 'true'
        working-directory: sing-box
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          make lib_install
          export PATH="$PATH:$(go env GOPATH)/bin"
          go run ./cmd/internal/build_libbox -target android -platform "android/${{ matrix.go_arch }}"
          cp libbox.aar "$GITHUB_WORKSPACE/libbox.aar"
      - name: Upload library
        uses: actions/upload-artifact@v4
        with:
          name: libbox-android-${{ matrix.go_arch }}
          path: libbox.aar
          if-no-files-found: error
          compression-level: 0

  apk:
    name: Build release APKs
    runs-on: ubuntu-latest
    needs:
      - libbox
    if: github.event_name != 'workflow_dispatch' || inputs.signing_check_only == false
    timeout-minutes: 90
    outputs:
      debug_signed: ${{ steps.signing.outputs.debug_signed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup OpenJDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Download libraries
        uses: actions/download-artifact@v4
        with:
          pattern: libbox-android-*
          path: libbox-inputs
          merge-multiple: true
      - name: Install libbox
        run: |
          set -euo pipefail
          aar=$(find libbox-inputs -name libbox.aar -print -quit)
          if [ -z "$aar" ]; then
            echo "expected libbox.aar in downloaded artifacts"
            find libbox-inputs -print
            exit 1
          fi
          mkdir -p app/libs
          cp "$aar" app/libs/libbox.aar
          # Keeps the otherLegacy file entry resolvable without building it.
          cp "$aar" app/libs/libbox-legacy.aar
      - name: Configure signing
        id: signing
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import os
          import subprocess
          from pathlib import Path

          keys = [
              "SIGNING_KEYSTORE_BASE64",
              "SIGNING_KEYSTORE_PASSWORD",
              "SIGNING_KEY_ALIAS",
              "SIGNING_KEY_PASSWORD",
          ]
          values = {key: os.environ.get(key, "") for key in keys}
          missing = [key for key, value in values.items() if not value]
          if missing:
              raise SystemExit(
                  "Missing signing secrets: "
                  + ", ".join(missing)
                  + ". Set SIGNING_KEYSTORE_BASE64, SIGNING_KEYSTORE_PASSWORD, "
                  + "SIGNING_KEY_ALIAS, and SIGNING_KEY_PASSWORD. "
                  + "Debug signing is not allowed."
              )

          def prop_escape(text: str) -> str:
              out = []
              for index, ch in enumerate(text):
                  if ch == "\\":
                      out.append("\\\\")
                  elif ch == "\n":
                      out.append("\\n")
                  elif ch == "\r":
                      out.append("\\r")
                  elif ch == "\t":
                      out.append("\\t")
                  elif ch in "#!=:" or (ch == " " and (index == 0 or index == len(text) - 1)):
                      out.append("\\" + ch)
                  else:
                      out.append(ch)
              return "".join(out)

          keystore = Path("app/release.keystore")
          keystore.parent.mkdir(parents=True, exist_ok=True)
          try:
              keystore.write_bytes(base64.b64decode(values["SIGNING_KEYSTORE_BASE64"], validate=True))
          except Exception as error:
              raise SystemExit(f"SIGNING_KEYSTORE_BASE64 is not valid base64: {error}") from error
          store_pass = values["SIGNING_KEYSTORE_PASSWORD"]
          alias = values["SIGNING_KEY_ALIAS"]
          key_pass = values["SIGNING_KEY_PASSWORD"]
          listed = subprocess.run(
              [
                  "keytool", "-list", "-storetype", "PKCS12",
                  "-keystore", str(keystore),
                  "-storepass", store_pass,
                  "-alias", alias,
              ],
              capture_output=True,
              text=True,
          )
          if listed.returncode != 0:
              raise SystemExit("Signing keystore could not be opened with the provided alias and passwords.")
          print(f"Using signing secrets. Alias: {alias}")

          props = Path("signing.properties")
          props.write_text(
              "KEYSTORE_PASS=" + prop_escape(store_pass) + "\n"
              + "ALIAS_NAME=" + prop_escape(alias) + "\n"
              + "ALIAS_PASS=" + prop_escape(key_pass) + "\n",
              encoding="utf-8",
          )
          encoded = base64.b64encode(props.read_bytes()).decode("ascii")
          props.unlink()
          env_path = Path(os.environ["GITHUB_ENV"])
          with env_path.open("a", encoding="utf-8") as handle:
              handle.write(f"LOCAL_PROPERTIES={encoded}\n")
              handle.write("DEBUG_SIGNED=false\n")
          output_path = Path(os.environ["GITHUB_OUTPUT"])
          with output_path.open("a", encoding="utf-8") as handle:
              handle.write("debug_signed=false\n")
          PY
      - name: Build
        env:
          LOCAL_PROPERTIES: ${{ env.LOCAL_PROPERTIES }}
        run: |
          set -euo pipefail
          sed -i 's/-Xmx8192m/-Xmx6g -XX:MaxMetaspaceSize=512m/' gradle.properties
          chmod +x ./gradlew
          if [ -z "${ANDROID_HOME:-}" ] && [ -n "${ANDROID_SDK_ROOT:-}" ]; then
            echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
            ANDROID_HOME="${ANDROID_SDK_ROOT}"
          fi
          if [ -n "${ANDROID_HOME:-}" ]; then
            mkdir -p "$ANDROID_HOME/licenses"
            printf '%s\n' "24333f8a63b6825ea9c5514f83c2829b004d1fee" "d56f5187479451eabf01fb78af6dfcb131a6481e" > "$ANDROID_HOME/licenses/android-sdk-license" || true
          fi
          ./gradlew :app:assembleOtherRelease --stacktrace
      - name: Collect APKs
        run: |
          set -euo pipefail
          mkdir -p dist
          find app/build/outputs/apk -path '*release*.apk' -name '*.apk' -exec cp {} dist/ \;
          python3 - <<'PY'
          import pathlib
          import sys
          import zipfile

          apks = sorted(pathlib.Path("dist").glob("*.apk"))
          if not apks:
              sys.exit("no release APKs were produced")
          installable = False
          for apk in apks:
              with zipfile.ZipFile(apk) as archive:
                  names = archive.namelist()
              has_manifest = "AndroidManifest.xml" in names
              has_dex = any(name.startswith("classes") and name.endswith(".dex") for name in names)
              has_arm64 = any(name.startswith("lib/arm64-v8a/") and name.endswith(".so") for name in names)
              print(f"{apk.name}: manifest={has_manifest} dex={has_dex} arm64={has_arm64}")
              if has_manifest and has_dex and has_arm64:
                  installable = True
          if not installable:
              sys.exit("no installable arm64-v8a or universal APK")
          PY
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: dist/*.apk

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - version
      - apk
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: release-apks
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          DEBUG_SIGNED: ${{ needs.apk.outputs.debug_signed }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="dispatch-${GITHUB_RUN_NUMBER}"
          fi
          if [ "${DEBUG_SIGNED}" = "true" ]; then
            echo "Refusing to publish a debug-signed release."
            exit 1
          fi
          TITLE="${TAG}"
          NOTES=$(printf '%s\n' "Wonder fork of sing-box for Android." "Signed with the repository signing key.")
          PRERELEASE=()
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            PRERELEASE=(--prerelease)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
            gh release upload "$TAG" dist/*.apk --clobber
          else
            gh release create "$TAG" dist/*.apk --target "${GITHUB_SHA}" --title "$TITLE" --notes "$NOTES" "${PRERELEASE[@]}"
          fi
          gh release view "$TAG" --json url,assets --jq '{url: .url, assets: [.assets[].url]}'
